[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[project]
name = "hermes-onnx-asr"
dynamic = ["version"]
description = "CPU-only ONNX ASR transcription provider for Hermes Agent"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Hermes ONNX ASR contributors" }]
dependencies = [
    "filelock>=4.0.9,<5",
    # Git-installed Hermes uses 0.0.0 metadata; compat.py checks the host API.
    "hermes-agent>=0",
    "huggingface-hub>=2.1.1,<3",
    "onnx-asr[cpu]>=0.12.0,<0.13",
    "onnxruntime>=1.30.0,<1.31",
    "packaging>=26.0,<27",
    "pydantic>=2.13.4,<3",
    "pydantic-settings>=2.15.0,<3",
]

[tool.hatch.version]
path = "plugin.yaml"
pattern = '^version:\s*(?P<version>[^\s]+)\s*$'

[project.entry-points."hermes_agent.plugins"]
"onnx-asr" = "hermes_onnx_asr"

[tool.hatch.build.targets.wheel]
packages = ["src/hermes_onnx_asr"]

[tool.hatch.build.targets.wheel.force-include]
"plugin.yaml" = "hermes_onnx_asr/plugin.yaml"
