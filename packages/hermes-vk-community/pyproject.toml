[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[project]
name = "hermes-vk-community"
dynamic = ["version"]
description = "VK Community Long Poll platform plugin for Hermes Agent"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Hermes VK Community contributors" }]
dependencies = [
    "aiohttp>=3.14.3",
    "aiosqlite==0.22.1",
    "filetype==1.2.0",
    # Git-installed Hermes uses 0.0.0 metadata; compat.py checks the host API.
    "hermes-agent>=0",
    "markdown-it-py>=4.2.0,<5",
    "packaging>=26.0,<27",
    "pillow>=12.2,<13",
    "pydantic>=2.13.4,<3",
    "pydantic-settings>=2.15.0,<3",
    "tenacity==9.1.4",
]

[tool.hatch.version]
path = "plugin.yaml"
pattern = '^version:\s*(?P<version>[^\s]+)\s*$'

[project.entry-points."hermes_agent.plugins"]
"vk-community" = "hermes_vk_community"

[tool.hatch.build.targets.wheel]
packages = ["src/hermes_vk_community"]

[tool.hatch.build.targets.wheel.force-include]
"plugin.yaml" = "hermes_vk_community/plugin.yaml"
