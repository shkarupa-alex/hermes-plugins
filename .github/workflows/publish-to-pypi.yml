name: Publish to PyPI

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to rebuild and publish
        required: true
        type: string
      skip_existing:
        description: Skip files already accepted by PyPI (recovery only)
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: pypi-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: false

jobs:
  release-version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      ref: ${{ steps.release.outputs.ref }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Resolve canonical release version
        id: release
        env:
          RAW_RELEASE: ${{ inputs.release_tag || github.ref_name }}
        run: python tools/release_version.py resolve "$RAW_RELEASE" --github-output "$GITHUB_OUTPUT"
      - name: Require an existing release tag
        env:
          RELEASE_REF: ${{ steps.release.outputs.ref }}
        run: git show-ref --verify --quiet "$RELEASE_REF"

  release-gates:
    needs: release-version
    uses: ./.github/workflows/release-gates.yml
    with:
      release_tag: ${{ needs.release-version.outputs.tag }}
      release_ref: ${{ needs.release-version.outputs.ref }}
    secrets: inherit

  release-build:
    runs-on: ubuntu-latest
    needs: [release-version, release-gates]

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-version.outputs.ref }}

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Apply and verify the release version
        env:
          RELEASE_TAG: ${{ needs.release-version.outputs.tag }}
        run: |
          python tools/release_version.py apply "$RELEASE_TAG"
          python tools/check_versions.py --tag "$RELEASE_TAG"

      - name: Build release distributions
        run: uv build --all-packages --out-dir dist --clear

      - name: Verify release distributions
        env:
          RELEASE_TAG: ${{ needs.release-version.outputs.tag }}
        run: python tools/release_version.py verify-artifacts "$RELEASE_TAG" dist

      - name: Upload release distributions
        uses: actions/upload-artifact@v7.0.1
        with:
          name: release-dists
          path: dist/
          if-no-files-found: error
          retention-days: 7

  pypi-publish:
    runs-on: ubuntu-latest
    needs: release-build
    permissions:
      id-token: write

    environment:
      name: pypi

    steps:
      - name: Retrieve release distributions
        uses: actions/download-artifact@v8.0.1
        with:
          name: release-dists
          path: dist/

      - name: Publish release distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          print-hash: true
          skip-existing: ${{ inputs.skip_existing || false }}
