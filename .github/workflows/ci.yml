name: CI

on:
  pull_request:
  push:
    branches: [develop, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  supply-chain:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.14"
      - name: Audit locked production dependencies
        run: |
          uv export --all-packages --locked --no-dev --no-emit-workspace --no-emit-package hermes-agent --output-file requirements-audit.txt
          # The frozen Git host has 0.0.0 placeholder metadata, which pip-audit
          # cannot match to a release advisory. Audit every registry dependency.
          uv tool run pip-audit --requirement requirements-audit.txt --no-deps --disable-pip
      - name: Scan repository history for secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.14"
          enable-cache: true
      - run: python tools/sync_workspace.py
      - run: uv run --no-sync python tools/check_versions.py
      - run: uv run --no-sync ruff format --check .
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync pyright
      - run: uv run --no-sync pytest -q --cov --cov-branch --cov-report=term-missing
      - run: uv build --all-packages

  os-contracts:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.14"
            package: ""
            tests: ""
          - os: windows-2022
            python: "3.14"
            package: ""
            tests: ""
          - os: macos-15
            python: "3.14"
            package: ""
            tests: ""
          # ONNX Runtime no longer publishes macOS Intel wheels.
          - os: macos-15-intel
            python: "3.14"
            package: "--package hermes-vk-community"
            tests: "packages/hermes-vk-community/tests"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: python tools/sync_workspace.py ${{ matrix.package }}
      - run: uv run --no-sync pytest -q ${{ matrix.tests }}

  hermes-compatibility:
    strategy:
      fail-fast: false
      matrix:
        include:
          - hermes: "0.18.2"
            python: "3.11"
          - hermes: "0.19.0"
            python: "3.13"
          - hermes: "0.21.5"
            python: "3.13"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ matrix.python }}
      - run: uv venv --python ${{ matrix.python }}
      - if: matrix.hermes != '0.21.5'
        run: uv pip install --no-sources "hermes-agent==${{ matrix.hermes }}"
      - if: matrix.hermes == '0.21.5'
        name: Install frozen Hermes 0.21.5 release
        run: |
          git clone --filter=blob:none --no-checkout --depth 1 --branch v2026.9.24 https://github.com/NousResearch/hermes-agent.git "$RUNNER_TEMP/hermes-agent-release"
          git -C "$RUNNER_TEMP/hermes-agent-release" sparse-checkout set agent tools hermes_cli gateway tui_gateway cron acp_adapter plugins providers hermes_platform
          git -C "$RUNNER_TEMP/hermes-agent-release" checkout
          uv pip install --no-sources --editable "$RUNNER_TEMP/hermes-agent-release"
      - run: >-
          uv pip install --no-sources --editable packages/hermes-vk-community --editable packages/hermes-onnx-asr
          "pytest>=9.1.1" "pytest-asyncio>=1.4.0" "jiwer==4.0.0"
      - run: .venv/bin/python -m pytest -q

  hermes-trace-upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.14"
      - run: python tools/sync_workspace.py
      - name: Resolve the frozen host's trace-upload extra with both plugins
        run: |
          uv run --no-sync python - <<'PY'
          import os
          import pathlib
          import tomllib
          config = tomllib.loads(pathlib.Path("pyproject.toml").read_text())
          path = pathlib.Path(os.environ["RUNNER_TEMP"]) / "host-overrides.txt"
          path.write_text("\n".join(config["tool"]["uv"]["override-dependencies"]) + "\n")
          PY
          uv pip install --no-sources --overrides "$RUNNER_TEMP/host-overrides.txt" \
            --editable '.hermes-agent[trace-upload]' \
            --editable packages/hermes-vk-community --editable packages/hermes-onnx-asr
      - run: uv run --no-sync pytest -q
      - name: Audit the resolved extra's registry dependencies
        run: |
          uv pip freeze --exclude-editable > requirements-trace-audit.txt
          uv tool run pip-audit --requirement requirements-trace-audit.txt --no-deps --disable-pip

  hermes-main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.14"
      - run: python tools/sync_workspace.py
      - name: Install Hermes main as an editable checkout
        run: |
          git clone --depth 1 https://github.com/NousResearch/hermes-agent.git "$RUNNER_TEMP/hermes-agent-main"
          # Keep the audited dependency graph; this job detects host API drift.
          uv pip install --no-deps --editable "$RUNNER_TEMP/hermes-agent-main"
      - run: uv run --no-sync pytest -q
